name: ✨ 기능 요청
description: 아이디어나 개선 제안을 남겨주세요
title: "[요청] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        좋은 아이디어 감사합니다! 💡
        아래 내용을 채워주시면 검토에 도움이 돼요.

  - type: textarea
    id: idea
    attributes:
      label: 어떤 기능을 원하시나요?
      description: 원하는 기능을 구체적으로 설명해주세요.
      placeholder: 예) Fold 6 프레임도 지원해줘
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
      description: 이 기능이 어떤 문제를 해결하는지, 누구에게 유용한지 적어주세요.

  - type: textarea
    id: alternative
    attributes:
      label: 대안 / 참고 자료
      description: 비슷한 도구나 참고할 만한 링크가 있으면 알려주세요.
